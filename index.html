<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Country Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
            background: #f5f5f5;
        }

        /* Simple tooltip styling for countries without data */
        .leaflet-tooltip.custom-tooltip {
            background: transparent;
            border: none;
            box-shadow: none;
            padding: 0;
        }

        .leaflet-tooltip.custom-tooltip:before {
            display: none;
        }

        /* Cursor-following tooltip */
        .cursor-tooltip {
            position: fixed;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 16px;
            pointer-events: none;
            z-index: 10000;
            display: none;
            max-width: 300px;
        }

        .country-info h3 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #333;
            font-weight: 600;
        }

        .country-info p {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .country-info a {
            color: #0066cc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .country-info a:hover {
            text-decoration: underline;
        }


        /* Remove the outline/bounding box on click */
        .leaflet-interactive:focus {
            outline: none !important;
        }

        path.leaflet-interactive:focus {
            outline: none !important;
        }

        svg {
            outline: none !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="cursor-tooltip" id="tooltip"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize the map centered on Europe (no base tiles for clean look)
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false,
            minZoom: 2,
            maxZoom: 6,
            maxBounds: [
                [-90, -180],  // Southwest coordinates
                [90, 180]     // Northeast coordinates
            ],
            maxBoundsViscosity: 1.0  // Makes bounds "hard" - can't drag outside at all
        }).setView([50, 10], 4);

        // Get tooltip element
        const tooltip = document.getElementById('tooltip');

        // Country data with custom information
        // You can add more countries here with their info and links
        const countryData = {
            'France': {
                description: 'Explore French culture and cuisine',
                link: 'https://example.com/france'
            },
            'Germany': {
                description: 'Discover German engineering and history',
                link: 'https://example.com/germany'
            },
            'Japan': {
                description: 'Experience Japanese technology and traditions',
                link: 'https://example.com/japan'
            },
            'United States of America': {
                description: 'Learn about American innovation',
                link: 'https://example.com/usa'
            },
            'Brazil': {
                description: 'Explore Brazilian biodiversity',
                link: 'https://example.com/brazil'
            },
            'Australia': {
                description: 'Discover Australian wildlife',
                link: 'https://example.com/australia'
            }
        };

        // Style for country boundaries
        function getInactiveStyle() {
            return {
                fillColor: '#D0D0D0',
                weight: 1,
                opacity: 1,
                color: '#FFFFFF',
                fillOpacity: 0.6
            };
        }

        function getDefaultStyle() {
            return {
                fillColor: '#4A90E2',
                weight: 1,
                opacity: 1,
                color: '#FFFFFF',
                fillOpacity: 0.7
            };
        }

        function getHighlightStyle() {
            return {
                fillColor: '#FF6B6B',
                weight: 2,
                opacity: 1,
                color: '#FFFFFF',
                fillOpacity: 0.85
            };
        }

        // Mouse move handler to follow cursor
        document.addEventListener('mousemove', function(e) {
            tooltip.style.left = (e.clientX + 15) + 'px';
            tooltip.style.top = (e.clientY + 15) + 'px';
        });

        // Load and display country boundaries
        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    style: function(feature) {
                        const countryName = feature.properties.name;
                        // Countries with data get blue, others get gray
                        if (countryData[countryName]) {
                            return getDefaultStyle();
                        } else {
                            return getInactiveStyle();
                        }
                    },
                    onEachFeature: function(feature, layer) {
                        const countryName = feature.properties.name;

                        // Only add interactions to countries with data
                        if (countryData[countryName]) {
                            const info = countryData[countryName];

                            // Hover events for highlighting and showing tooltip
                            layer.on('mouseover', function(e) {
                                layer.setStyle(getHighlightStyle());

                                // Show cursor-following tooltip
                                tooltip.innerHTML = `
                                    <div class="country-info">
                                        <h3>${countryName}</h3>
                                        <p>${info.description}</p>
                                        <a href="${info.link}" target="_blank">Learn more →</a>
                                    </div>
                                `;
                                tooltip.style.display = 'block';
                            });

                            layer.on('mouseout', function() {
                                layer.setStyle(getDefaultStyle());
                                tooltip.style.display = 'none';
                            });

                            // Click to open link
                            layer.on('click', function() {
                                window.open(info.link, '_blank');
                            });
                        }
                        // Countries without data: no interactions at all
                    }
                }).addTo(map);
            })
            .catch(error => console.error('Error loading country data:', error));
    </script>
</body>
</html>
